# Fonte única dos comandos de verificação deste projeto.
# Lido pelos hooks (gate.sh, format.sh, guard.sh) e citado no AGENTS.md.
# Use só comandos que existem de verdade no projeto. String vazia desliga o passo.
# Comando com $ ou crase vai entre aspas simples, senão o shell expande ao ler este arquivo.

# Rápido: typecheck e só os testes afetados. Alvo: menos de 30 segundos.
# {changed} vira a lista de arquivos alterados (rastreados e novos), já com aspas, sem .md,
# .context/ e .claude/. Turno só de documentação ou plano não roda o gate.
# Exemplos por stack:
#   vitest : npx tsc --noEmit && npx vitest related --run --bail=1 --passWithNoTests {changed}
#   jest   : npx tsc --noEmit && npx jest --findRelatedTests {changed} --bail --passWithNoTests
#   pytest : pytest --testmon -x -q            (pytest-testmon)
#   pest   : ./vendor/bin/pest --dirty --stop-on-failure
#   go     : go vet ./... && go test -short -failfast ./...
GATE_FAST="<ex.: npx tsc --noEmit && npx vitest related --run --bail=1 --passWithNoTests {changed}>"

# Completo: suíte inteira + build. Roda no fim de cada fase do plano e no ship, nunca por task.
# Sempre pela fila: .claude/hooks/tq.sh "$GATE_FULL" (o hook fila.sh obriga).
# Monorepo: encadeie o comando de cada deployable com &&.
GATE_FULL="<ex.: npm test && npm run build>"

# Monorepo: partes do GATE_FULL por pasta, "pasta=comando" separados por |. No fim de fase,
# `.claude/hooks/tq.sh --fase` roda só as partes que o diff tocou; o GATE_FULL inteiro fica para o
# fim do plano. Vazio: --fase roda o GATE_FULL.
# Ex.: GATE_PARTS="bank-api=cd bank-api && composer test|bank-app=cd bank-app && npm test"
GATE_PARTS=""

# Formatter para um arquivo editado. Use {file}. String vazia desliga.
FORMAT="<ex.: npx prettier --write {file}>"

# 1 roda o GATE_FAST no fim do turno; 0 desliga (use 0 se o gate já está vermelho antes de você mexer).
GATE_ON_STOP=1

# Quantas vezes o gate pode segurar o mesmo turno antes de liberar com aviso.
GATE_MAX_RETRIES=3

# Segundos até o GATE_FAST ser interrompido.
GATE_TIMEOUT=120
# 1 faz o GATE_FAST também esperar a fila de testes. Deixe 0 se ele roda só os afetados.
TQ_FAST=0

# Fila de testes (tq.sh): suíte pesada roda uma por vez neste repositório, inclusive entre worktrees.
# 1 liga o hook fila.sh, que manda pela fila o GATE_FULL e os comandos de TQ_MATCH.
TQ_ON=1
# Comandos de suíte inteira além do GATE_FULL, separados por |. Escreva o comando sem * no fim:
# "pytest" já pega "pytest -x -q" (só flags) e deixa passar "pytest tests/a.py" (teste afetado).
# Um * no fim mandaria para a fila também o teste de um arquivo.
TQ_MATCH="<ex.: npm test|npm run test|npx vitest run|pytest|php artisan test|./vendor/bin/pest|go test ./...>"
# Segundos máximos na fila antes de desistir (sai 75). 0 espera sem limite.
TQ_WAIT=0

# Escopo T.A.C.E: edição fora da seção A da task ativa do plano. avisar | bloquear | desligado
ESCOPO=avisar

# Ritmo do thread principal: aviso único por turno para pesar delegação. 0 desliga cada um.
RITMO_EDITS=5
RITMO_READS=15

# 1: pedido que começa com "detalhe" (ou curto com a palavra) recebe aviso de modo técnico nesta resposta.
DETALHE_HOOK=1

# Statusline: teto do texto da tarefa (a linha também se ajusta à largura do terminal).
STATUS_TASK_MAX=40

# Padrões (sintaxe de case do shell, onde * casa com /) separados por espaço.
# Cada padrão também casa em qualquer subpasta (secrets/* pega app/secrets/x) e sem diferença de maiúsculas.
# Arquivos que o agente não edita. Modelos (*.example, *.sample, *.template) ficam sempre liberados, mesmo se casarem.
PROTECTED="<ex.: .env .env.local .env.*.local .env.production .env.staging .env.development .env.test *.pem *.key package-lock.json pnpm-lock.yaml composer.lock>"
# Migrations: arquivo já versionado no git não é editado; a correção é uma migration nova.
MIGRATIONS="<ex.: supabase/migrations/* database/migrations/*>"
# Testes: travados para edição enquanto existir .claude/hooks/tests.lock (testes primeiro).
TESTS="<ex.: *.test.ts *.spec.ts tests/* __tests__/*>"
